{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testimonies</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>

    <main class="projects-page">
        <nav class="navigation">
            <a href="{% url 'home' %}">← Back to Home</a>
        </nav>

        <h3 class="page-title">Testimonies</h3>

        <a href="{% url 'add_testimony' %}" class="leave-testimony-btn">+ Leave a Testimony</a>

        <section class="testimonies-grid">
            {% for testimony in testimonies %}
            <a href="{% url 'testimony_detail' testimony.pk %}" class="testimony-card">
                <h2 class="testimony-name">{{ testimony.full_name }}</h2>
                <p class="testimony-preview">{{ testimony.content|truncatechars:80 }}</p>
            </a>
            {% endfor %}
        </section>
    </main>

</body>
</html>
