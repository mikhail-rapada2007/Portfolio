{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Tech Stack</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>

    <main class="projects-page">
        <nav class="navigation">
            <a href="{% url 'dashboard' %}">← Back to Dashboard</a>
        </nav>

        <h3 class="page-title">Add a New Tech Stack</h3>

        <form method="post" class="project-form">
            {% csrf_token %}

            <label for="{{ form.name.id_for_label }}" class="form-label">Tech Stack Name</label>
            {{ form.name }}
            {% if form.name.errors %}<p class="form-error">{{ form.name.errors.0 }}</p>{% endif %}

            <button type="submit">Add Tech Stack</button>
        </form>
    </main>

</body>
</html>
