{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Project</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>

    <main class="projects-page">
        <nav class="navigation">
            <a href="{% url 'dashboard' %}">← Back to Dashboard</a>
        </nav>

        <h3 class="page-title">Add a New Project</h3>

        <form method="post" class="project-form">
            {% csrf_token %}

            <label for="{{ form.project_name.id_for_label }}" class="form-label">Project Name</label>
            {{ form.project_name }}

            <label for="{{ form.description.id_for_label }}" class="form-label">Description</label>
            {{ form.description }}

            <label class="form-label">Tech Stack</label>
            <div class="tech-stack-checkboxes">
                {{ form.tech_stack }}
            </div>

            <label for="{{ form.link.id_for_label }}" class="form-label">Link</label>
            {{ form.link }}

            {% if form.errors %}
                <p style="color: #f87171;">Please fill in all required fields correctly.</p>
            {% endif %}

            <button type="submit">Add Project</button>
        </form>
    </main>

</body>
</html>
