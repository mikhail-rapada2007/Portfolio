{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Project</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>

    <main class="projects-page">
        <nav class="navigation">
            <a href="{% url 'projects' %}">← Back to Projects</a>
        </nav>

        <h3 class="page-title">Add a New Project</h3>

        <form method="post" class="project-form">
            {% csrf_token %}

            <label for="{{ form.project_name.id_for_label }}">Project Name</label>
            {{ form.project_name }}

            <label for="{{ form.description.id_for_label }}">Description</label>
            {{ form.description }}

            <label for="{{ form.tech_stack.id_for_label }}">Tech Stack</label>
            {{ form.tech_stack }}

            <label for="{{ form.link.id_for_label }}">Link</label>
            {{ form.link }}

            <button type="submit">Add Project</button>
        </form>
    </main>

</body>
</html>
